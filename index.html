<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transfer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.2.0/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#F5F6F8;--card:#fff;--ink:#17181C;--muted:#6A6E79;--line:#E3E5EA;
  --orange:#FF6600;--orange-hover:#E65500;--orange-soft:#FFF3EB;
  --brand:var(--orange);--brand-hover:var(--orange-hover);--brand-soft:var(--orange-soft);
  --sun:#FFA726;--ok:var(--orange);--ok-hover:var(--orange-hover);--ok-soft:var(--orange-soft);
  --bad:#B4281F;--bad-soft:#FDECEA;--net-green:#1E8A59;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:28px;
  --r:12px;--rl:20px;
  --sh:0 2px 4px rgba(23,24,28,.04),0 12px 32px -8px rgba(23,24,28,.12);
  --f:'Schibsted Grotesk','Hind Siliguri',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);min-height:100vh;display:flex;flex-direction:column;align-items:center}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}

/* Responsive Desktop & Mobile App Wrapper */
.app-wrap{width:94%;max-width:1380px;margin:12px auto 40px;padding:0 24px;display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 54px)}

/* Top bar */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 8px;gap:8px}
.status-indicator{display:flex;align-items:center;flex:none}
.status-dot{width:10px;height:10px;border-radius:50%;background:#8A8E99;transition:background .2s,box-shadow .2s}
.status-dot.online{background:var(--net-green);box-shadow:0 0 8px rgba(30,138,89,.6)}

.header-right-group{display:flex;align-items:center;gap:8px;flex:none}

/* Universal Allow Toggle */
.auto-allow-toggle{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--line);padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;user-select:none;transition:border-color .15s,background .15s,color .15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.auto-allow-toggle:hover{border-color:#CBCFD8}
.auto-allow-toggle:has(input:checked){background:var(--orange-soft);border-color:rgba(255,102,0,.35);color:var(--orange)}
.auto-allow-toggle input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.toggle-slider{width:28px;height:16px;background:#CBCFD8;border-radius:99px;position:relative;transition:background .2s;flex:none}
.toggle-slider::after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.auto-allow-toggle input:checked + .toggle-slider{background:var(--orange)}
.auto-allow-toggle input:checked + .toggle-slider::after{transform:translateX(12px)}
.auto-allow-text{font-size:12px;white-space:nowrap}

.my-id-badge{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.04);flex:none}
.my-id-badge span{color:var(--muted)}
.my-id-badge b{color:var(--orange);font-size:16px;font-weight:800}

/* Toast Notifications */
.app-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(50px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.16,1,.3,1),opacity .2s;z-index:100001;white-space:nowrap;display:flex;align-items:center;gap:8px}
.app-toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}

/* Tab Navigation */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#E8EAEF;border-radius:14px;padding:4px;width:100%}
.seg button{min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);transition:background .15s,color .15s,transform .1s}
.seg button:active{transform:scale(.98)}
.seg button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.seg i{font-style:normal;min-width:20px;height:20px;border-radius:10px;background:var(--orange);color:#fff;font-size:11px;display:inline-grid;place-items:center;padding:0 5px}

/* Main Card */
.card{background:var(--card);border-radius:var(--rl);box-shadow:var(--sh);padding:22px;width:100%;display:flex;flex-direction:column;gap:16px}

/* Dropzone Area */
.drop{border:2.5px dashed #CBCFD8;border-radius:var(--rl);padding:44px 20px;text-align:center;transition:background .15s,border-color .15s;background:#FAFAFC}
.drop.over{background:var(--orange-soft);border-color:var(--orange)}
.drop .ic{width:52px;height:52px;color:var(--orange);margin-bottom:12px}
.drop-text{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 16px;text-align:center}
.drop .row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}

.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);border-radius:var(--r);background:#fff;padding:0 20px;font-weight:700;font-size:14px;cursor:pointer;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn:hover{background:#F0F1F4}

/* Action Footer with unified Send Bar */
.foot{display:flex;flex-direction:column;gap:12px;width:100%}
.foot .sum:empty{display:none}
.sum{color:var(--muted);font-size:13px;font-weight:600;text-align:center}

.send-bar{display:flex;align-items:center;gap:10px;width:100%}
.target-input-wrap{display:flex;align-items:center;gap:8px;background:#F5F6F9;border:1.5px solid var(--line);border-radius:var(--r);padding:0 14px;flex:1;min-height:48px;transition:border-color .15s,background .15s}
.target-input-wrap:focus-within{border-color:var(--orange);background:#fff;box-shadow:0 0 0 3px rgba(255,102,0,.12)}
.target-input-wrap label{font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
.target-input-wrap input{border:none;background:transparent;width:100%;font-size:16px;font-weight:800;color:var(--ink);padding:0}
.target-input-wrap input:focus{outline:none}
.target-input-wrap input::placeholder{font-size:13px;font-weight:500;color:#9A9EA9}

.go{min-height:48px;padding:0 24px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r);background:var(--orange);color:#fff;font-weight:800;font-size:15px;white-space:nowrap;transition:background .15s,transform .1s,box-shadow .15s;box-shadow:0 4px 14px rgba(255,102,0,.28)}
.go:active:not(:disabled){transform:scale(.98)}
.go:hover:not(:disabled){background:var(--orange-hover);box-shadow:0 6px 18px rgba(255,102,0,.35)}
.go:disabled{background:#E3E5EA;color:#9A9EA9;cursor:not-allowed;box-shadow:none}

/* File list & items */
.fl{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;text-align:left;max-height:280px;overflow:auto}
.fl li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#F5F6F8;border-radius:10px;border:1px solid transparent;transition:background .15s,border-color .15s}
.fl li:hover{background:#EFF1F5;border-color:var(--line)}
.ext{min-width:38px;height:28px;border-radius:6px;background:var(--ink);color:#fff;font:700 11px var(--f);display:grid;place-items:center;padding:0 4px}

/* Thumbnails */
.file-thumb{width:42px;height:42px;border-radius:8px;flex:none;object-fit:cover;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--ink);color:#fff;text-transform:uppercase;cursor:pointer}
.thumb-img{border:1px solid rgba(0,0,0,.08);transition:transform .15s;background:#EAECF0}
.thumb-img:hover{transform:scale(1.06)}
.thumb-pdf{background:#B4281F;color:#fff}
.thumb-video{background:#4F46E5;color:#fff}
.thumb-audio{background:#0284C7;color:#fff}
.thumb-text{background:#374151;color:#fff}
.thumb-ext{background:var(--ink);color:#fff}

.file-info-wrap{flex:1;min-width:0;display:flex;flex-direction:column;cursor:pointer}
.file-info-wrap .n{font-weight:600;font-size:13px;word-break:break-all;overflow-wrap:anywhere;white-space:normal;color:var(--ink);line-height:1.35}
.file-info-wrap .z{font-size:11px;color:var(--muted);margin-top:2px}

.file-row-actions{display:flex;align-items:center;gap:6px;flex:none}
.btn-file-action{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;cursor:pointer;border:1px solid transparent;text-decoration:none;transition:all .15s}
.btn-file-action.view{color:var(--orange);border-color:#FFD4BA;background:var(--orange-soft)}
.btn-file-action.view:hover{background:#FFE0CC}
.btn-file-action.dl{color:#fff;background:var(--orange);border-color:var(--orange);box-shadow:0 2px 6px rgba(255,102,0,.2)}
.btn-file-action.dl:hover{background:var(--orange-hover);border-color:var(--orange-hover)}
.btn-file-action.del{color:var(--bad);background:#fff;border-color:var(--line);padding:6px 9px}
.btn-file-action.del:hover{background:var(--bad-soft)}

/* Batch Download Bar */
.select-bar{display:flex;align-items:center;justify-content:flex-end;padding:8px 12px;background:#F0F2F6;border-radius:10px;margin-top:10px;gap:8px}
.btn-dl-all{min-height:38px;padding:0 18px;background:var(--orange);color:#fff;border:0;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,transform .1s;box-shadow:0 2px 8px rgba(255,102,0,.25)}
.btn-dl-all:hover{background:var(--orange-hover)}
.btn-dl-all:active{transform:scale(.98)}

textarea{width:100%;min-height:220px;border:1.5px solid var(--line);border-radius:var(--r);padding:14px;font:14px/1.6 Consolas,'Courier New',monospace;resize:vertical;background:#FAFAFC;transition:border-color .15s}
textarea:focus{border-color:var(--orange);background:#fff;outline:none}
.cnt{margin:0;font-size:12px;color:var(--muted);text-align:right;font-weight:600}

/* Transfer log list */
.xf{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.xf li{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-radius:var(--r);box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--line)}
.xf .xl{flex:1;font-weight:600;font-size:13px}
.dots{display:flex;gap:4px}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f);background:#EEF0F3;color:var(--muted)}
.dot.ok{background:var(--orange-soft);color:var(--orange)}
.dot.no{background:var(--bad-soft);color:var(--bad)}
.dot.wait{background:#FFF3CC;color:#7A5B00}

/* Received Inbox items */
.item{background:#fff;border-radius:var(--r);border:1px solid var(--line);padding:16px;margin-bottom:12px;border-top:4px solid var(--sun)}
.item.received{border-top-color:var(--orange)}
.item.blocked{border-top-color:var(--line);display:flex;align-items:center;gap:10px;color:var(--muted)}
.item .hd{display:flex;align-items:center;gap:10px;font-weight:700}
.item pre{margin:10px 0;padding:12px;background:#F5F6F8;border-radius:8px;max-height:260px;overflow:auto;white-space:pre-wrap;font:13px/1.6 Consolas,monospace}
.pv{margin:8px 0 0;color:var(--muted);overflow-wrap:anywhere;font-size:13px}
.acts{display:flex;gap:10px;margin-top:12px}
.acts .allow{flex:1;min-height:44px;border:0;border-radius:var(--r);background:var(--orange);color:#fff;font-weight:800;font-size:14px;box-shadow:0 2px 8px rgba(255,102,0,.25);transition:background .15s}
.acts .allow:hover:not(:disabled){background:var(--orange-hover)}
.acts .block{min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;font-weight:700;color:var(--bad);font-size:13px}
.empty{display:grid;place-items:center;padding:48px 0;color:#B8BCC6}
.empty .ic{width:56px;height:56px}

/* Incoming Notification Modal Popup Window */
.modal-overlay{position:fixed;inset:0;background:rgba(23,24,28,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:99999;animation:modalFade .2s ease-out}
.modal-card{background:#fff;border-radius:24px;box-shadow:0 24px 56px rgba(0,0,0,.25);max-width:380px;width:100%;padding:26px 20px;text-align:center;animation:modalScale .25s cubic-bezier(.16,1,.3,1)}
.modal-badge{width:52px;height:52px;border-radius:50%;background:var(--orange);color:#fff;font:800 22px/52px var(--f);display:inline-grid;place-items:center;margin-bottom:12px;box-shadow:0 8px 20px rgba(255,102,0,.25)}
.modal-title{font-size:19px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
.modal-desc{font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.4}
.modal-filebox{background:#F5F6F8;border-radius:var(--r);padding:10px 12px;margin-bottom:18px;text-align:left;max-height:140px;overflow:auto}
.modal-acts{display:flex;gap:10px}
.modal-allow{flex:1;min-height:48px;border:0;border-radius:var(--r);background:var(--orange);color:#fff;font-weight:800;font-size:15px;cursor:pointer;transition:background .15s,transform .1s;box-shadow:0 4px 14px rgba(255,102,0,.25)}
.modal-allow:hover{background:var(--orange-hover)}
.modal-allow:active{transform:scale(.98)}
.modal-block{min-height:48px;padding:0 18px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;color:var(--bad);font-weight:700;font-size:14px;cursor:pointer}

/* Universal File Preview Modal */
.preview-modal-overlay{position:fixed;inset:0;background:rgba(15,17,23,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100000;animation:modalFade .2s ease-out}
.preview-modal-box{background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.35);max-width:880px;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:modalScale .25s cubic-bezier(.16,1,.3,1)}
.preview-modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:#FAFAFC;gap:12px}
.preview-file-info{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.preview-ext-badge{min-width:44px;height:30px;border-radius:6px;font:800 11px var(--f);display:grid;place-items:center;color:#fff;background:var(--ink);padding:0 6px}
.preview-ext-badge.image{background:var(--orange)}
.preview-ext-badge.pdf{background:#B4281F}
.preview-ext-badge.video{background:#4F46E5}
.preview-ext-badge.audio{background:#0284C7}
.preview-ext-badge.text{background:#374151}

.preview-file-text{min-width:0;flex:1}
.preview-file-name{font-weight:700;font-size:15px;color:var(--ink);word-break:break-all;overflow-wrap:anywhere;white-space:normal}
.preview-file-meta{font-size:12px;color:var(--muted);margin-top:2px}
.preview-header-actions{display:flex;align-items:center;gap:8px;flex:none}
.btn-preview-dl{padding:8px 18px;background:var(--orange);color:#fff;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background .15s;box-shadow:0 2px 8px rgba(255,102,0,.25)}
.btn-preview-dl:hover{background:var(--orange-hover)}
.btn-preview-close{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:700;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:all .15s}
.btn-preview-close:hover{background:#F0F1F4;color:var(--ink)}

.preview-modal-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:#0F1117;position:relative;min-height:280px;max-height:calc(92vh - 75px)}
.preview-modal-body.light-bg{background:#F5F6F8}

.preview-img{max-width:100%;max-height:80vh;object-fit:contain;border-radius:4px;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.preview-pdf-wrap{width:100%;height:80vh;display:flex;flex-direction:column}
.preview-iframe{width:100%;flex:1;border:none;background:#fff}
.preview-pdf-bar{padding:10px 14px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center}
.btn-pdf-external{font-size:13px;font-weight:700;color:var(--orange);text-decoration:none}
.btn-pdf-external:hover{text-decoration:underline}

.preview-media{max-width:100%;max-height:80vh;border-radius:8px}
.preview-audio-wrap{padding:40px 24px;width:100%;max-width:440px;text-align:center;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);margin:24px}
.preview-audio-icon{font-size:42px;margin-bottom:8px}
.preview-text-box{width:100%;height:100%;max-height:80vh;overflow:auto;padding:18px;margin:0;font:13px/1.6 Consolas,Courier,monospace;background:#16181F;color:#E6EDF3;white-space:pre-wrap;word-break:break-word}
.preview-unsupported{padding:40px 20px;text-align:center;color:#fff}

@keyframes modalFade{from{opacity:0}to{opacity:1}}
@keyframes modalScale{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}

/* Desktop Enhancements (Full-screen PC experience) */
@media (min-width: 769px){
  .card{padding:36px 44px;border-radius:24px;min-height:520px;justify-content:space-between}
  .drop{padding:64px 24px;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .drop .ic{width:64px;height:64px;margin-bottom:16px}
  .drop-text{font-size:18px;margin:0 0 20px}
  .btn{min-height:48px;padding:0 30px;font-size:15px}
  .seg{max-width:620px;margin:0 auto;width:100%}
  .foot{flex-direction:row;align-items:center;justify-content:space-between;gap:20px;padding-top:16px;border-top:1px solid var(--line)}
  .foot .sum{text-align:left;font-size:14px}
  .send-bar{max-width:460px}
  textarea{min-height:420px;font-size:16px;line-height:1.7;padding:20px}
  .fl{grid-template-columns:repeat(auto-fill, minmax(340px, 1fr));max-height:400px}
}

/* Mobile Adjustments (Keep clean and compact on phones) */
@media (max-width: 768px){
  .app-wrap{width:100%;max-width:100%;margin:8px auto 24px;padding:0 12px;gap:10px}
  .card{padding:16px;border-radius:16px}
  .drop{padding:24px 10px;min-height:auto}
  .drop-text{font-size:13px;margin:0 0 12px}
  .seg button{min-height:42px;font-size:13px;gap:4px}
  .target-input-wrap{padding:0 10px}
  .go{padding:0 18px;font-size:14px}
  .foot{flex-direction:column;gap:12px;border-top:none;padding-top:0}
  .send-bar{width:100%}
  .fl{grid-template-columns:1fr}
  .preview-modal-box{border-radius:16px;max-height:96vh}
  .preview-modal-header{padding:12px 14px}
  .preview-img{max-height:75vh}
  .preview-pdf-wrap{height:75vh}
  .select-bar{justify-content:stretch}
  .btn-dl-all{width:100%;justify-content:center}
  .file-row-actions{gap:4px}
  .btn-file-action{padding:5px 9px;font-size:11px}
  .auto-allow-toggle{padding:4px 8px;gap:5px}
  .auto-allow-text{font-size:11px}
  .toggle-slider{width:24px;height:14px}
  .toggle-slider::after{width:10px;height:10px}
  .auto-allow-toggle input:checked + .toggle-slider::after{transform:translateX(10px)}
  .my-id-badge{padding:5px 10px;font-size:12px}
  .my-id-badge b{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app-wrap">
  <!-- Top bar with Online indicator dot, Universal Allow toggle & Single "Your ID" badge -->
  <header class="top-bar">
    <div class="status-indicator" id="netStatus" title="Network status">
      <span class="status-dot"></span>
    </div>
    <div class="header-right-group">
      <label class="auto-allow-toggle" title="Universal Allow: Automatically accept incoming transfers without permission prompt">
        <input type="checkbox" id="autoAllowCheck">
        <span class="toggle-slider"></span>
        <span class="auto-allow-text">Universal Allow</span>
      </label>
      <div class="my-id-badge">
        <span>Your ID:</span>
        <b id="myid">–</b>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="seg" id="tabs" role="tablist"></nav>

  <!-- Active Panel Content -->
  <main id="panel" role="tabpanel"></main>
</div>

<!-- Modal Container for Instant Notification Window -->
<div id="modalHost"></div>

<!-- Universal Live File Preview Modal -->
<div id="previewHost"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
const P={send:'<path d="M7 3h7l5 5v13H7zM14 3v5h5"/>',group:'<circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16 5.2a3 3 0 010 5.6M18 14c1.8.7 3 2.4 3 5"/>',text:'<path d="M5 6h14M5 12h14M5 18h9"/>',up:'<path d="M12 16V4m0 0L7 9m5-5l5 5M4 20h16"/>',inbox:'<path d="M3 13l3-8h12l3 8v6H3zM3 13h5l1.5 2.5h5L16 13h5"/>'};
const svg=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const ext=n=>{const m=n.match(/\.([A-Za-z0-9]{1,4})$/);return m?m[1].toLowerCase():'file'};

function getMime(name, explicitType) {
  if (explicitType && explicitType !== 'application/octet-stream') return explicitType;
  const e = (name.split('.').pop() || '').toLowerCase();
  const map = {
    pdf: 'application/pdf',
    png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml', bmp: 'image/bmp', ico: 'image/x-icon', avif: 'image/avif',
    mp4: 'video/mp4', webm: 'video/webm', ogv: 'video/ogg', mov: 'video/quicktime',
    mp3: 'audio/mpeg', wav: 'audio/wav', ogg: 'audio/ogg', m4a: 'audio/mp4', aac: 'audio/aac', flac: 'audio/flac',
    txt: 'text/plain', md: 'text/markdown', json: 'application/json', js: 'text/javascript', ts: 'text/plain', html: 'text/html', css: 'text/css', csv: 'text/csv', py: 'text/plain', c: 'text/plain', cpp: 'text/plain', java: 'text/plain', xml: 'application/xml', log: 'text/plain'
  };
  return map[e] || explicitType || 'application/octet-stream';
}

function getFileTypeCategory(name, type) {
  const mime = type || getMime(name);
  const e = (name.split('.').pop() || '').toLowerCase();
  if (mime.startsWith('image/') || ['jpg','jpeg','png','gif','webp','svg','bmp','ico','avif'].includes(e)) return 'image';
  if (mime === 'application/pdf' || e === 'pdf') return 'pdf';
  if (mime.startsWith('video/') || ['mp4','webm','ogv','mov','mkv'].includes(e)) return 'video';
  if (mime.startsWith('audio/') || ['mp3','wav','ogg','m4a','aac','flac'].includes(e)) return 'audio';
  if (mime.startsWith('text/') || ['txt','md','json','js','ts','css','html','py','csv','xml','c','cpp','java','log','sql'].includes(e)) return 'text';
  return 'other';
}

const me = {
  uid: Math.random().toString(36).slice(2, 10),
  id: 0
};

let ch, mqttClient, peer;
let peers = new Map(), sent = new Map(), log = [], inbox = [], tab = 'send', staged = [], textVal = '', targetId = null, lastSig = '';
let autoAllow = localStorage.getItem('dak_universal_allow') === 'true';
const others = () => [...peers.values()].sort((a,b) => a.id - b.id);

function showToast(msg, duration = 3200) {
  let toast = $('#appToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'appToast';
    toast.className = 'app-toast';
    document.body.appendChild(toast);
  }
  toast.innerHTML = msg;
  toast.classList.add('show');
  clearTimeout(toast._tid);
  toast._tid = setTimeout(() => {
    toast.classList.remove('show');
  }, duration);
}

function initAutoAllow() {
  const check = $('#autoAllowCheck');
  if (check) {
    check.checked = autoAllow;
    check.addEventListener('change', e => {
      autoAllow = e.target.checked;
      localStorage.setItem('dak_universal_allow', autoAllow);
      showToast(autoAllow ? '⚡ Universal Allow ON: No approval needed for incoming transfers' : 'Universal Allow OFF: Will prompt before receiving');
    });
  }
}

function pickAvailableId() {
  const taken = new Set([...peers.values()].map(p => p.id));
  let id = 1;
  while (taken.has(id)) {
    id++;
  }
  return id;
}

function updateNetStatus(online) {
  const dot = $('#netStatus .status-dot');
  const wrap = $('#netStatus');
  if (dot) {
    if (online) {
      dot.className = 'status-dot online';
      if (wrap) wrap.title = 'Status: Online';
    } else {
      dot.className = 'status-dot';
      if (wrap) wrap.title = 'Status: Connecting...';
    }
  }
}

function initPeer() {
  if (peer && !peer.destroyed) return;
  try {
    peer = new Peer('dak-' + me.uid, {
      debug: 1,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:global.stun.twilio.com:3478' }
        ]
      }
    });
    peer.on('connection', conn => {
      conn.on('data', data => handle(data));
    });
    peer.on('error', err => console.warn('Peer warning:', err.type));
  } catch (e) {
    console.error('Peer init error:', e);
  }
}

function post(m) {
  const payload = { ...m, uid: me.uid, fromId: me.id };
  if (ch) {
    try { ch.postMessage(payload); } catch (e) {}
  }
  if (mqttClient && mqttClient.connected) {
    try {
      if (payload.t !== 'data' || payload.text) {
        mqttClient.publish('dak/main/room', JSON.stringify(payload));
      }
    } catch (e) {}
  }
}

function connect() {
  if (ch) { post({ t: 'bye' }); try { ch.close(); } catch(e){} }
  if (mqttClient) {
    try {
      mqttClient.publish('dak/main/room', JSON.stringify({ t: 'bye', uid: me.uid, fromId: me.id }));
      mqttClient.end();
    } catch(e){}
  }
  peers.clear();
  updateNetStatus(false, 'Connecting...');

  try {
    ch = new BroadcastChannel('dak:TRANSFER_LAB');
    ch.onmessage = e => handle(e.data);
  } catch (e) {}

  initPeer();

  try {
    mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      clientId: 'dak_' + me.uid + '_' + Math.random().toString(16).slice(2, 6),
      clean: true,
      connectTimeout: 5000,
      reconnectPeriod: 3000
    });

    mqttClient.on('connect', () => {
      mqttClient.subscribe('dak/main/room', { qos: 0 });
      updateNetStatus(true, 'Online');
      post({ t: 'hi' });
    });

    mqttClient.on('message', (t, payload) => {
      try {
        const m = JSON.parse(payload.toString());
        if (m && m.uid !== me.uid) {
          handle(m);
        }
      } catch (err) {}
    });

    mqttClient.on('offline', () => updateNetStatus(false, 'Offline'));
    mqttClient.on('error', () => updateNetStatus(false, 'Error'));
  } catch (e) {
    console.warn('MQTT init error:', e);
  }

  post({ t: 'hi' });
  setTimeout(() => {
    if (!me.id) {
      me.id = pickAvailableId();
    }
    beat();
    draw();
  }, 400);
  draw();
}

const beat = () => { if (me.id) post({ t: 'beat', id: me.id }) };

function handle(m) {
  if (m.t === 'hi') { beat(); return; }
  if (m.t === 'beat') {
    if (m.id === me.id && m.uid !== me.uid) {
      if (m.uid < me.uid) {
        me.id = pickAvailableId();
        beat();
      }
    }
    peers.set(m.uid, { id: m.id, seen: Date.now() });
    drawIfChanged();
    return;
  }
  if (m.t === 'bye') {
    peers.delete(m.uid);
    draw();
    return;
  }
  if (m.t === 'offer') {
    const isForMe = m.to === 'all' || (Array.isArray(m.to) && m.to.some(x => Number(x) === Number(me.id))) || Number(m.toId) === Number(me.id);
    if (!isForMe) return;
    const item = { ...m, status: 'pending', from: { id: m.fromId || m.from?.id || '?' } };
    inbox.unshift(item);

    if (autoAllow) {
      item.status = 'accepting';
      post({ t: 'ok', oid: item.oid, toUid: item.uid, toId: item.from.id, fromId: me.id });
      showToast(`⚡ Universal Allow: Auto-accepting from ID ${item.from.id}…`);
      draw();
    } else {
      showIncomingNotification(item);
      draw();
    }
    return;
  }
  if (m.toUid && m.toUid !== me.uid && m.toId !== me.id) return;
  if (m.t === 'ok') {
    const o = sent.get(m.oid);
    if (!o) return;
    o.res[m.fromId] = 'ok';

    post({ t: 'data', oid: m.oid, toUid: m.uid, toId: m.fromId, files: o.files, text: o.text });

    if (peer && !peer.destroyed && o.files && o.files.length) {
      try {
        const conn = peer.connect('dak-' + m.uid, { reliable: true });
        conn.on('open', async () => {
          const filesData = await Promise.all(o.files.map(async f => ({
            name: f.name,
            size: f.size,
            type: f.type || getMime(f.name),
            buffer: f.buffer || ((f.blob instanceof Blob) ? await f.blob.arrayBuffer() : f.blob)
          })));
          conn.send({
            t: 'data',
            oid: m.oid,
            toUid: m.uid,
            toId: m.fromId,
            files: filesData,
            text: o.text,
            uid: me.uid,
            fromId: me.id
          });
        });
      } catch (err) {
        console.warn('WebRTC send error:', err);
      }
    }
    drawPanel();
  }
  if (m.t === 'no') {
    const o = sent.get(m.oid);
    if (o) { o.res[m.fromId] = 'no'; drawPanel(); }
  }
  if (m.t === 'data') {
    const it = inbox.find(i => i.oid === m.oid);
    if (!it) return;
    it.status = 'received';
    it.text = m.text;
    it.urls = (m.files || []).map(f => {
      const mime = f.type || getMime(f.name);
      let blob;
      if (f.buffer) blob = new Blob([f.buffer], { type: mime });
      else if (f.blob instanceof Blob) blob = f.blob.slice(0, f.blob.size, mime);
      else if (f.blob instanceof ArrayBuffer) blob = new Blob([f.blob], { type: mime });
      else blob = new Blob([f.blob || f], { type: mime });
      return {
        name: f.name,
        size: f.size,
        type: mime,
        blob: blob,
        url: URL.createObjectURL(blob)
      };
    });

    onDataReceived(it);
    draw();
  }
}

/* Modal Popup Window */
function showIncomingNotification(item) {
  const fromId = item.from.id;
  const isText = item.kind === 'text';
  let previewHtml = '';

  if (isText) {
    previewHtml = `<div class="modal-filebox"><p style="margin:0;font-size:14px;color:var(--ink);">${esc(item.meta.preview)}…</p></div>`;
  } else {
    previewHtml = `
      <div class="modal-filebox">
        <ul class="fl" style="margin:0;">
          ${(item.meta || []).map(f => {
            const cat = getFileTypeCategory(f.name, f.type);
            return `
              <li>
                <span class="ext ${cat === 'pdf' ? 'thumb-pdf' : ''}">${esc(ext(f.name))}</span>
                <span class="n">${esc(f.name)}</span>
                <span class="z">${fmt(f.size)}</span>
              </li>
            `;
          }).join('')}
        </ul>
      </div>
    `;
  }

  const modalHtml = `
    <div class="modal-overlay" id="activeModal">
      <div class="modal-card">
        <div class="modal-badge">${fromId}</div>
        <h3 class="modal-title">Incoming from ID ${fromId}</h3>
        <p class="modal-desc">${isText ? 'Sent you a text note' : `${(item.meta || []).length} file(s) ready to transfer`}</p>
        ${previewHtml}
        <div class="modal-acts" id="modalActions">
          <button class="modal-block" id="modalDecline">Decline</button>
          <button class="modal-allow" id="modalAllow">Accept</button>
        </div>
      </div>
    </div>
  `;

  $('#modalHost').innerHTML = modalHtml;

  $('#modalAllow').onclick = () => {
    item.status = 'accepting';
    post({ t: 'ok', oid: item.oid, toUid: item.uid, toId: item.from.id, fromId: me.id });
    closeModal();
    tab = 'receive';
    showToast(`Receiving files from ID ${fromId}… ⏳`);
    draw();
  };

  $('#modalDecline').onclick = () => {
    item.status = 'blocked';
    post({ t: 'no', oid: item.oid, toUid: item.uid, toId: item.from.id, fromId: me.id });
    closeModal();
    draw();
  };
}

function onDataReceived(item) {
  closeModal(); // Ensure alert box is closed immediately upon data receipt
  if (item.text) {
    try { navigator.clipboard.writeText(item.text); } catch (e) {}
  }

  const fromId = item.fromId || item.from?.id || '?';
  const fileCount = (item.urls || []).length;

  if (item.text) {
    showToast(`✓ Received text from ID ${fromId} (copied to clipboard)`);
  } else {
    showToast(`✓ Received ${fileCount} file${fileCount > 1 ? 's' : ''} from ID ${fromId}!`);
  }

  tab = 'receive';
  draw();
}

function closeModal() {
  $('#modalHost').innerHTML = '';
}

function downloadFiles(files) {
  if (!files || !files.length) return;
  files.forEach((f, idx) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = f.url;
      const fname = f.name.includes('/') ? f.name.split('/').pop() : f.name;
      a.download = fname || 'file';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, idx * 250);
  });
}

function renderReceivedFileList(item) {
  if (!item.urls || !item.urls.length) return '';
  const rows = item.urls.map((u, idx) => {
    const cat = getFileTypeCategory(u.name, u.type);
    const origFileName = u.name.includes('/') ? u.name.split('/').pop() : u.name;
    let thumbHtml = '';
    if (cat === 'image') {
      thumbHtml = `<img src="${u.url}" class="file-thumb thumb-img" data-act="preview-received" data-oid="${item.oid}" data-idx="${idx}" alt="thumb" title="Click to preview image">`;
    } else if (cat === 'pdf') {
      thumbHtml = `<div class="file-thumb thumb-pdf" data-act="preview-received" data-oid="${item.oid}" data-idx="${idx}" title="Click to view PDF">PDF</div>`;
    } else if (cat === 'video') {
      thumbHtml = `<div class="file-thumb thumb-video" data-act="preview-received" data-oid="${item.oid}" data-idx="${idx}" title="Click to play video">▶</div>`;
    } else if (cat === 'audio') {
      thumbHtml = `<div class="file-thumb thumb-audio" data-act="preview-received" data-oid="${item.oid}" data-idx="${idx}" title="Click to play audio">🎵</div>`;
    } else if (cat === 'text') {
      thumbHtml = `<div class="file-thumb thumb-text" data-act="preview-received" data-oid="${item.oid}" data-idx="${idx}" title="Click to read text">TXT</div>`;
    } else {
      thumbHtml = `<div class="file-thumb thumb-ext" data-act="preview-received" data-oid="${item.oid}" data-idx="${idx}">${esc(ext(u.name))}</div>`;
    }

    return `
      <li>
        ${thumbHtml}
        <div class="file-info-wrap" data-act="preview-received" data-oid="${item.oid}" data-idx="${idx}">
          <span class="n" title="${esc(u.name)}">${esc(u.name)}</span>
          <span class="z">${fmt(u.size)} · ${cat.toUpperCase()}</span>
        </div>
        <div class="file-row-actions">
          <button class="btn-file-action view" data-act="preview-received" data-oid="${item.oid}" data-idx="${idx}" title="Preview file live">👁 View</button>
          <a class="btn-file-action dl" href="${u.url}" download="${esc(origFileName)}" title="Download file">⬇ Download</a>
        </div>
      </li>
    `;
  }).join('');

  const multiBar = item.urls.length > 1 ? `
    <div class="select-bar">
      <button class="btn-dl-all" data-act="download-all" data-oid="${item.oid}">
        ⬇ Download All (${item.urls.length})
      </button>
    </div>
  ` : '';

  return `
    ${multiBar}
    <ul class="fl" style="max-height:360px;margin-top:10px;">
      ${rows}
    </ul>
  `;
}

function stagedRows(arr) {
  return arr.map((f, idx) => {
    const cat = getFileTypeCategory(f.name, f.type);
    let thumb = '';
    if (cat === 'image') {
      try {
        const u = URL.createObjectURL(f);
        thumb = `<img src="${u}" class="file-thumb thumb-img" data-act="preview-staged" data-idx="${idx}" alt="thumb" title="Click to preview">`;
      } catch(e) {
        thumb = `<div class="file-thumb thumb-ext">${esc(ext(f.name))}</div>`;
      }
    } else if (cat === 'pdf') {
      thumb = `<div class="file-thumb thumb-pdf" data-act="preview-staged" data-idx="${idx}" title="Click to view PDF">PDF</div>`;
    } else {
      thumb = `<div class="file-thumb thumb-ext" data-act="preview-staged" data-idx="${idx}">${esc(ext(f.name))}</div>`;
    }

    return `
      <li>
        ${thumb}
        <div class="file-info-wrap" data-act="preview-staged" data-idx="${idx}">
          <span class="n" title="${esc(f.webkitRelativePath || f.name)}">${esc(f.webkitRelativePath || f.name)}</span>
          <span class="z">${fmt(f.size)} · ${cat.toUpperCase()}</span>
        </div>
        <div class="file-row-actions">
          <button class="btn-file-action view" data-act="preview-staged" data-idx="${idx}" title="Preview file">👁 View</button>
          <button class="btn-file-action del" data-act="remove-staged" data-idx="${idx}" title="Remove file">✕</button>
        </div>
      </li>
    `;
  }).join('');
}

async function previewFile(file) {
  const cat = getFileTypeCategory(file.name, file.type);
  const host = $('#previewHost');
  if (!host) return;

  const url = file.url || (file.blob ? URL.createObjectURL(file.blob) : '');
  const fileName = esc(file.name.split('/').pop() || file.name);
  const sizeStr = file.size ? fmt(file.size) : '';

  let bodyContent = '';
  let isLight = false;

  if (cat === 'image') {
    bodyContent = `<img src="${url}" alt="${fileName}" class="preview-img">`;
  } else if (cat === 'pdf') {
    bodyContent = `
      <div class="preview-pdf-wrap">
        <iframe src="${url}#toolbar=1" class="preview-iframe" title="${fileName}"></iframe>
        <div class="preview-pdf-bar">
          <a href="${url}" target="_blank" rel="noopener" class="btn-pdf-external">↗ Open PDF in full tab</a>
        </div>
      </div>
    `;
    isLight = true;
  } else if (cat === 'video') {
    bodyContent = `<video controls autoplay playsinline src="${url}" class="preview-media"></video>`;
  } else if (cat === 'audio') {
    bodyContent = `
      <div class="preview-audio-wrap">
        <div class="preview-audio-icon">🎵</div>
        <div style="font-weight:700;font-size:16px;margin:8px 0 16px;">${fileName}</div>
        <audio controls autoplay src="${url}" style="width:100%"></audio>
      </div>
    `;
    isLight = true;
  } else if (cat === 'text') {
    let textContent = '';
    try {
      if (file.blob) {
        textContent = await file.blob.text();
      } else if (url) {
        const res = await fetch(url);
        textContent = await res.text();
      }
    } catch (e) {
      textContent = 'Unable to load preview: ' + e.message;
    }
    bodyContent = `<pre class="preview-text-box"><code>${esc(textContent)}</code></pre>`;
  } else {
    bodyContent = `
      <div class="preview-unsupported">
        <div style="font-size:48px;margin-bottom:12px;">📁</div>
        <h3 style="margin:0 0 8px;">${fileName}</h3>
        <p style="color:#A0A4B0;margin:0 0 20px;">${sizeStr ? sizeStr + ' · ' : ''}Preview not available for this format</p>
        ${url ? `<a href="${url}" download="${fileName}" class="btn" style="display:inline-flex;">Download File</a>` : ''}
      </div>
    `;
  }

  host.innerHTML = `
    <div class="preview-modal-overlay" id="activePreviewOverlay">
      <div class="preview-modal-box">
        <div class="preview-modal-header">
          <div class="preview-file-info">
            <span class="preview-ext-badge ${cat}">${cat.toUpperCase()}</span>
            <div class="preview-file-text">
              <div class="preview-file-name" title="${fileName}">${fileName}</div>
              <div class="preview-file-meta">${sizeStr ? sizeStr + ' · ' : ''}${cat.toUpperCase()}</div>
            </div>
          </div>
          <div class="preview-header-actions">
            ${url ? `<a class="btn-preview-dl" href="${url}" download="${fileName}" title="Download file">⬇ Download</a>` : ''}
            <button class="btn-preview-close" id="closePreviewBtn" title="Close preview">✕</button>
          </div>
        </div>
        <div class="preview-modal-body ${isLight ? 'light-bg' : ''}">
          ${bodyContent}
        </div>
      </div>
    </div>
  `;

  $('#closePreviewBtn').onclick = closePreview;
  $('#activePreviewOverlay').onclick = e => {
    if (e.target.id === 'activePreviewOverlay') closePreview();
  };
}

function closePreview() {
  const host = $('#previewHost');
  if (host) host.innerHTML = '';
}

setInterval(() => {
  beat();
  const n = Date.now();
  for (const [k, p] of peers) if (n - p.seen > 6500) peers.delete(k);
  drawIfChanged();
}, 2000);

addEventListener('beforeunload', () => { try { post({ t: 'bye' }) } catch(e){} });
const sig = () => me.id + '|' + others().map(p => p.id).join(',');
function drawIfChanged() { if (sig() !== lastSig) draw() }

function offer(kind, payload, label, meta, toList) {
  const to = toList || (tab === 'group' ? 'all' : [targetId]);
  const res = {};
  (to === 'all' ? others().map(p => p.id) : to).forEach(i => res[i] = 'wait');
  const oid = me.uid + Date.now();
  sent.set(oid, { ...payload, label, kind, res, to });
  log.unshift(oid);
  if (log.length > 5) log.pop();
  post({ t: 'offer', oid, fromId: me.id, to, kind, meta });
}

const canSend = () => {
  if (!me.id) return false;
  if (tab === 'group') return staged.length > 0;
  if (tab === 'send') return staged.length > 0 && targetId && targetId !== me.id;
  if (tab === 'text') return textVal.trim().length > 0 && targetId && targetId !== me.id;
  return false;
};

function updateSendButton() {
  const btn = document.querySelector('[data-act="sendfiles"], [data-act="sendtext"]');
  if (btn) btn.disabled = !canSend();
}

function draw() {
  lastSig = sig();
  const v = me.id || '–';
  const myidEl = $('#myid');
  if (myidEl) myidEl.textContent = v;

  const pend = inbox.filter(i => i.status === 'pending').length;
  const T = [['send','Send','send'],['receive','Receive','inbox'],['group','Group','group'],['text','Text','text']];
  $('#tabs').innerHTML = T.map(([k,l,i]) => `<button role="tab" aria-selected="${tab === k}" data-tab="${k}" aria-label="${l}">${svg(i)}<span>${l}</span>${k === 'receive' && pend ? `<i>${pend}</i>` : ''}</button>`).join('');
  drawPanel();
}

function fileRows(arr) {
  return arr.map(f => `<li><span class="ext">${esc(ext(f.name))}</span><span class="n">${esc(f.webkitRelativePath || f.name)}</span><span class="z">${fmt(f.size)}</span></li>`).join('');
}

function xfers() {
  return log.length ? `<ul class="xf">${log.map(oid => {
    const o = sent.get(oid);
    return `<li>${svg(o.kind === 'text' ? 'text' : 'send')}<span class="xl">${esc(o.label)}</span><span class="dots">${Object.entries(o.res).map(([id,s]) => `<span class="dot ${s}">${id}</span>`).join('')}</span></li>`
  }).join('')}</ul>` : '';
}

function drawPanel() {
  const el = $('#panel');
  if (tab === 'send' || tab === 'group') {
    el.innerHTML = `
      <div class="card">
        <div class="drop" id="dz">
          ${svg('send')}
          <p class="drop-text">Drag & drop files or folders here, or click to browse</p>
          <div class="row">
            <label class="btn">Files<input type="file" id="f1" multiple hidden></label>
            <label class="btn">Folder<input type="file" id="f2" webkitdirectory hidden></label>
          </div>
          ${staged.length ? `<ul class="fl">${stagedRows(staged)}</ul>` : ''}
        </div>
        <div class="foot">
          <span class="sum">${staged.length ? staged.length + ' file(s) · ' + fmt(staged.reduce((a,f) => a + f.size, 0)) : ''}</span>
          <div class="send-bar">
            ${tab !== 'group' ? `
              <div class="target-input-wrap">
                <label for="targetIdInput">To ID:</label>
                <input type="number" id="targetIdInput" min="1" max="999" placeholder="e.g. 2" value="${targetId || ''}" autocomplete="off">
              </div>
            ` : ''}
            <button class="go" data-act="sendfiles" ${canSend() ? '' : 'disabled'}>Send</button>
          </div>
        </div>
      </div>
      ${xfers()}
    `;
  } else if (tab === 'text') {
    const n = textVal ? textVal.split('\n').length : 0;
    el.innerHTML = `
      <div class="card">
        <textarea id="txt" aria-label="Text" placeholder="Type notes, links, code, or messages to beam..." spellcheck="false">${esc(textVal)}</textarea>
        <div class="foot">
          <span class="sum" id="cnt">${n} lines · ${textVal.length} chars</span>
          <div class="send-bar">
            <div class="target-input-wrap">
              <label for="targetIdInput">To ID:</label>
              <input type="number" id="targetIdInput" min="1" max="999" placeholder="e.g. 2" value="${targetId || ''}" autocomplete="off">
            </div>
            <button class="go" data-act="sendtext" ${canSend() ? '' : 'disabled'}>Send</button>
          </div>
        </div>
      </div>
      ${xfers()}
    `;
  } else {
    el.innerHTML = inbox.length ? inbox.map(itemHtml).join('') : `<div class="card"><div class="empty">${svg('inbox')}<p style="margin-top:10px;font-size:14px;color:var(--muted);">No transfers yet</p></div></div>`;
  }
}

function itemHtml(i) {
  const fromId = i.fromId || i.from?.id || '?';
  const av = `<span class="ext" style="background:var(--orange);">${fromId}</span>`;
  if (i.status === 'blocked') return `<article class="item blocked">${av}<span>Blocked from ID ${fromId}</span></article>`;
  const list = i.kind === 'text' ? `<p class="pv">${esc(i.meta.preview)}…</p>` : `<ul class="fl">${(i.meta || []).slice(0,6).map(f => `<li><span class="ext">${esc(ext(f.name))}</span><span class="n">${esc(f.name)}</span><span class="z">${fmt(f.size)}</span></li>`).join('')}</ul>`;
  if (i.status === 'pending') return `<article class="item"><div class="hd">${av}<span>Incoming from ID ${fromId} (${i.kind === 'text' ? 'Text' : i.meta.length + ' file' + (i.meta.length > 1 ? 's' : '')})</span></div>${list}<div class="acts"><button class="allow" data-act="allow" data-oid="${i.oid}">Accept</button><button class="block" data-act="block" data-oid="${i.oid}">Decline</button></div></article>`;
  if (i.status === 'accepting') return `<article class="item"><div class="hd">${av}<span class="dim">Receiving from ID ${fromId}… ⏳</span></div></article>`;
  const body = i.kind === 'text' ? `<pre style="white-space:pre-wrap;font:13px/1.6 Consolas,monospace;background:#F5F6F8;padding:12px;border-radius:10px;max-height:240px;overflow:auto;">${esc(i.text)}</pre><button class="btn" style="background:var(--orange);color:#fff;border-color:var(--orange);font-weight:700;" data-act="copy" data-oid="${i.oid}">Copy</button>`
    : renderReceivedFileList(i);
  return `<article class="item received"><div class="hd">${av}<span>Received from ID ${fromId}</span></div>${body}</article>`;
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-act]');
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; draw(); return; }
  const a = t.dataset.act, i = inbox.find(x => x.oid === t.dataset.oid);

  if (a === 'download-all') {
    const oid = t.dataset.oid;
    const item = inbox.find(x => x.oid === oid);
    if (!item || !item.urls || !item.urls.length) return;
    downloadFiles(item.urls);
    showToast(`Downloading all ${item.urls.length} files…`);
    return;
  }

  if (a === 'preview-received') {
    const oid = t.dataset.oid;
    const idx = parseInt(t.dataset.idx);
    const item = inbox.find(x => x.oid === oid);
    if (item && item.urls && item.urls[idx]) {
      previewFile(item.urls[idx]);
    }
    return;
  }

  if (a === 'preview-staged') {
    const idx = parseInt(t.dataset.idx);
    const f = staged[idx];
    if (f) {
      previewFile({
        name: f.name,
        size: f.size,
        type: f.type || getMime(f.name),
        blob: f,
        url: URL.createObjectURL(f)
      });
    }
    return;
  }

  if (a === 'remove-staged') {
    const idx = parseInt(t.dataset.idx);
    if (!isNaN(idx) && staged[idx]) {
      staged.splice(idx, 1);
      drawPanel();
    }
    return;
  }

  if (a === 'sendfiles') {
    if (!targetId && tab !== 'group') {
      const inp = $('#targetIdInput');
      if (inp) inp.focus();
      return;
    }
    const to = tab === 'group' ? 'all' : [targetId];
    const files = await Promise.all(staged.map(async f => ({
      name: f.webkitRelativePath || f.name,
      size: f.size,
      type: f.type || getMime(f.name),
      buffer: await f.arrayBuffer(),
      blob: f
    })));
    offer('file', { files }, files.length + ' file' + (files.length > 1 ? 's' : ''), files.map(({ name, size, type }) => ({ name, size, type: type || getMime(name) })), to);
    staged = []; drawPanel();
    return;
  }

  if (a === 'sendtext') {
    if (!targetId) {
      const inp = $('#targetIdInput');
      if (inp) inp.focus();
      return;
    }
    offer('text', { text: textVal }, 'Text', { size: textVal.length, preview: textVal.slice(0, 80) }, [targetId]);
    textVal = ''; drawPanel();
    return;
  }

  if (a === 'allow' && i) {
    i.status = 'accepting';
    post({ t: 'ok', oid: i.oid, toUid: i.uid, toId: i.from.id, fromId: me.id });
    drawPanel();
    return;
  }

  if (a === 'block' && i) {
    i.status = 'blocked';
    post({ t: 'no', oid: i.oid, toUid: i.uid, toId: i.from.id, fromId: me.id });
    draw();
    return;
  }

  if (a === 'copy' && i) {
    navigator.clipboard.writeText(i.text).then(() => { t.textContent = 'Copied'; });
    return;
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'f1' || e.target.id === 'f2') {
    staged = [...e.target.files];
    drawPanel();
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'targetIdInput') {
    targetId = parseInt(e.target.value) || null;
    updateSendButton();
  }
  if (e.target.id === 'txt') {
    textVal = e.target.value;
    $('#cnt').textContent = (textVal ? textVal.split('\n').length : 0) + ' lines · ' + textVal.length + ' chars';
    updateSendButton();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closePreview();
    closeModal();
  }
  if (e.key === 'Enter' && e.target.id === 'targetIdInput') {
    e.preventDefault();
    const sendBtn = document.querySelector('[data-act="sendfiles"], [data-act="sendtext"]');
    if (sendBtn && !sendBtn.disabled) {
      sendBtn.click();
    }
  }
});

const dz = document;
dz.addEventListener('dragover', e => {
  const d = $('#dz');
  if (d && (e.target === d || d.contains(e.target))) {
    e.preventDefault();
    d.classList.add('over');
  }
});
dz.addEventListener('dragleave', e => {
  const d = $('#dz');
  if (d && !d.contains(e.relatedTarget)) {
    d.classList.remove('over');
  }
});
dz.addEventListener('drop', e => {
  const d = $('#dz');
  if (d && (e.target === d || d.contains(e.target))) {
    e.preventDefault();
    d.classList.remove('over');
    if (tab === 'send' || tab === 'group') {
      staged = [...e.dataTransfer.files];
      drawPanel();
    }
  }
});

initAutoAllow();
connect();
</script>
</body>
</html>
